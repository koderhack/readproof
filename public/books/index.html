<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReadProof has a new home</title>
<meta name="description" content="ReadProof has moved. You will be redirected to the new home of ReadProof.">
<meta http-equiv="refresh" content="5;url=https://readproof.pages.dev/">
<link rel="icon" type="image/png" href="./icons/readproof-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main class="wrap">
  <div class="redirect-box">
    <a class="rp-brand" href="https://readproof.pages.dev/" style="justify-content:center"><span class="rp-brand-mark">R</span>ReadProof</a>
    <h1 class="rp-h2" style="margin-top:18px">ReadProof has a new home.</h1>
    <p class="rp-sub" style="margin:0 auto 6px">A new version of ReadProof is ready.<br><strong>You’ll be redirected in <span id="secs">5</span> seconds…</strong></p>
    <div class="count" id="count" aria-hidden="true">5</div>
    <div class="spinner" role="status" aria-label="Redirecting"></div>
    <div class="rp-actions" style="justify-content:center;margin-top:18px">
      <a class="btn btn-primary btn-lg" href="https://readproof.pages.dev/">Open ReadProof now →</a>
    </div>
    <noscript>
      <p class="muted" style="margin-top:16px">JavaScript is disabled — <a href="https://readproof.pages.dev/">click here to open ReadProof</a>. Your browser will also redirect you automatically in 5 seconds.</p>
    </noscript>
  </div>
</main>
<script>
(function(){
  var target = 'https://readproof.pages.dev/';
  var n = 5;
  var count = document.getElementById('count');
  var secs = document.getElementById('secs');
  var t = setInterval(function(){
    n--;
    if(n <= 0){ clearInterval(t); window.location.replace(target); return; }
    if(count) count.textContent = n;
    if(secs) secs.textContent = n;
  }, 1000);
})();
</script>
</body>
</html>
