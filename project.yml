name: ReadProof

options:
  bundleIdPrefix: com.readproof
  xcodeVersion: 15.0
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  ReadProof:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - ReadProof
    info:
      path: ReadProof/Info.plist
      properties:
        CFBundleDisplayName: ReadProof
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "ReadProof anty-screenshot: przednia kamera wykrywa, czy ktoś nie celuje drugim telefonem w Twój ekran."
        LSApplicationQueriesSchemes:
          - phantom
          - solflare
          - backpack
          - glow
          - brave
          - magiceden
          - wc
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - readproof
    settings:
      base:
        INFOPLIST_FILE: ReadProof/Info.plist
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  ReadProofLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: 17.0
    sources:
      - ReadProofLiveActivity
      - ReadProof/Services/ReadingSessionActivity.swift
    info:
      path: ReadProofLiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        INFOPLIST_FILE: ReadProofLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: false
    dependencies:
      - target: ReadProof
