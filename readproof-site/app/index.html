<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ReadProof — czytaj, udowodnij, zgarnij</title>
<meta name="description" content="Webowa aplikacja ReadProof: wybierz książkę i rozdział, przejdź quiz ze zrozumienia, zdobądź zweryfikowany dowód.">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta name="theme-color" content="#58CC02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
/* ── ReadProof App ── */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:72px}
.app-top{position:sticky;top:0;z-index:30;background:rgba(253,252,247,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.app-top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.rp-brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--ink);text-decoration:none}
.rp-brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(150deg,var(--green),var(--green-dark));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
  .rp-brand-mark img{width:28px;height:28px;border-radius:8px;display:block;object-fit:cover}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;padding:4px 10px;border-radius:999px;font-weight:600}
.pill.info{background:var(--blue-soft,#E8EFFC);color:var(--blue)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.mut{background:var(--line-soft);color:var(--muted)}
.pill.warn{background:#fff3cd;color:#8a6d00}
.wallet-pill{font-family:var(--font-mono);font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{max-width:640px;margin:0 auto;padding:20px 16px 88px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}
.card-warm{background:var(--card-warm,#FBF7EC);border:1px solid var(--line-soft);border-radius:20px;padding:20px}
.muted{color:var(--muted);font-size:.88rem}
.rp-kicker{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:700;margin:0 0 8px}
.rp-h1,.rp-h2{font-family:var(--font-display);font-weight:800;line-height:1.15;margin:0 0 8px}
.rp-sub{color:var(--ink-soft);font-size:.95rem}

/* ── bottom nav ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(253,252,247,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,6px)}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.65rem;font-weight:600;padding:6px 14px;transition:color .15s}
.bottom-nav a:hover,.bottom-nav a.active{color:var(--green)}
.bottom-nav .nav-icon{width:26px;height:26px;display:grid;place-items:center;font-size:1.15rem}

/* ── book rows ── */
.book-row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.book-row img{width:52px;height:72px;object-fit:cover;border-radius:8px;background:var(--paper)}
.book-row .t{flex:1;min-width:0}
.book-row .t b{display:block;font-family:var(--font-display);font-size:1.02rem;line-height:1.25}
.book-row .t span{font-size:.8rem;color:var(--muted)}

/* ── quiz ── */
.q-progress{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.q-progress .bar{flex:1;height:10px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.q-progress .bar > span{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .35s}
.q-progress .n{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 14px 40px rgba(20,25,15,.08);animation:qin .25s ease}
@keyframes qin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q-type{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.q-text{font-family:var(--font-display);font-size:clamp(1.2rem,4.5vw,1.55rem);line-height:1.25;margin:10px 0 4px}
.q-ctx{font-size:.92rem;color:var(--muted);margin:0 0 16px}
.ans{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ans-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:13px 15px;border-radius:16px;border:2px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:1rem;color:var(--ink);cursor:pointer;text-align:left;transition:transform .08s, border-color .12s}
.ans-btn .k{flex:0 0 auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--paper);font-family:var(--font-mono);font-size:.82rem;color:var(--muted)}
.ans-btn.hit{border-color:var(--green);background:var(--green-soft)}
.ans-btn.hit .k{background:var(--green);color:#fff}
.ans-btn.miss{border-color:#D66;background:#FDECEC}
.ans-btn:disabled{cursor:default;opacity:.85}
.ans-check{display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
.ans-check input{width:20px;height:20px;accent-color:var(--green)}
.ord-row{display:flex;align-items:center;gap:8px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;font-weight:600}
.ord-row .t{flex:1}
.ord-row button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:1.05rem;cursor:pointer}
.match-row{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.match-row select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-height:46px}
.big-input{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:14px;min-height:54px;background:#fff}
textarea.big-input{min-height:110px;resize:vertical}
.feedback{margin-top:14px;border-radius:14px;padding:13px 15px;font-weight:600}
.feedback.ok{background:var(--green-soft);color:var(--green-dark)}
.feedback.bad{background:#FDECEC;color:#8f1d1d}
.lock-wrap{text-align:center;padding:34px 10px}
.lock-num{font-family:var(--font-mono);font-size:2.4rem;font-weight:600}
.seal{border:3px double var(--green);border-radius:14px;color:var(--green-dark);font-family:var(--font-display);font-weight:900;letter-spacing:.05em;text-transform:uppercase;padding:12px 18px;display:inline-block;transform:rotate(-3deg);background:rgba(232,255,214,.6)}

/* ── tabs (Lektury sub-tabs) ── */
.sub-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.sub-tabs button{flex:none;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .12s}
.sub-tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
.sub-tabs button:hover:not(.active){background:var(--paper)}

/* ── lektury filter ── */
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-row input{flex:1;min-width:120px;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:.92rem}
.search-btn{padding:12px 18px;border-radius:14px;border:none;background:var(--green);color:#fff;font-weight:700;font-size:.92rem;cursor:pointer}

/* ── certificate ── */
.cert{text-align:center;padding:30px 20px;background:var(--card);border:2px solid var(--line);border-radius:24px}
.cert-k{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:8px}
.cert-book{font-family:var(--font-display);font-size:1.6rem;font-weight:800;margin:6px 0}
.cert-name{font-size:1.1rem;color:var(--ink-soft);margin-top:10px}
.cert-meta{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);margin-top:6px;word-break:break-all}

/* ── result ── */
.cert{text-align:center}
.cert-k{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:8px}
.cert-book{font-family:var(--font-display);font-size:1.6rem;font-weight:800;margin:6px 0}
.cert-name{font-size:1.1rem;color:var(--ink-soft);margin-top:10px}
.cert-meta{font-family:var(--font-mono);font-size:.75rem;color:var(--muted);margin-top:6px;word-break:break-all}

/* ── reward card ── */
.reward-card{background:linear-gradient(135deg,var(--green-soft),var(--gold-soft));border:1px solid var(--green);border-radius:20px;padding:20px;text-align:center}
.reward-card .amount{font-family:var(--font-display);font-size:2rem;font-weight:800;color:var(--green-dark)}

/* ── responsive ── */
@media(max-width:640px){.view{padding:14px 12px 88px}.card{padding:18px}}
@media print{.bottom-nav,.app-top,.btn,.no-print{display:none!important}body{background:#fff}@page{size:A4 landscape;margin:0}body *{visibility:hidden}.q-card,.q-card *{visibility:visible}.q-card{position:absolute;left:0;top:0;width:100%;min-height:100vh;box-shadow:none;animation:none;border-radius:0}}
body.quiz-active #view .ans, body.quiz-active #view .q-text, body.quiz-active #view .ord-row, body.quiz-active #view .match-row, body.quiz-active #view .q-ctx{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ── buttons (shared) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;text-decoration:none;border:2px solid transparent;transition:all .12s}
.btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn-primary:hover{background:var(--green-dark)}
.btn-ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--paper)}
.btn-sm{padding:8px 14px;font-size:.82rem;border-radius:10px}
.btn-lg{padding:16px 24px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:default}

/* ── testy: tryby dostarczania ── */
.mode-card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .12s;font:inherit;color:var(--ink)}
.mode-card:hover{border-color:var(--green)}
.mode-card.active{background:var(--green-soft);border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.mode-card .mc-ico{font-size:1.5rem;line-height:1}
.mode-card .mc-name{display:block;font-weight:800;font-size:.9rem;margin-top:6px}
.mode-card .mc-desc{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-weight:700;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.tbl td.pill-cell{white-space:nowrap}
.q-chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.q-chk:hover{border-color:var(--green)}
.q-chk.checked{background:var(--green-soft);border-color:var(--green)}
.ans-opt{display:block;width:100%;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;margin-bottom:8px;font:inherit;color:var(--ink)}
.ans-opt:hover{border-color:var(--green)}
.ans-opt.active{background:var(--green-soft);border-color:var(--green);font-weight:600}
body.rp-app{background:linear-gradient(180deg,#F7FAF7 0,#FDFCF7 420px)}
.app-top{background:rgba(253,252,247,.96);box-shadow:0 1px 0 rgba(23,32,43,.02)}
.app-top .wrap{min-height:64px}
.rp-brand{font-size:19px}
.rp-brand-mark{overflow:hidden;background:var(--green)}
.view{max-width:720px;padding-top:28px}
.card,.card-warm{box-shadow:none;border-radius:16px}
.bottom-nav{padding-inline:max(10px,env(safe-area-inset-left));box-shadow:0 -8px 24px rgba(23,32,43,.04)}
.bottom-nav a{min-width:62px;min-height:52px;justify-content:center;border-radius:12px}
.bottom-nav a.active{background:var(--green-soft)}
.bottom-nav .nav-icon{width:24px;height:24px}
.book-row{border-radius:14px;padding:12px;transition:border-color .15s,transform .15s}
.book-row:hover{border-color:#C8D8CD;transform:translateY(-1px)}
.book-row img{width:58px;height:80px}
.btn{min-height:46px}
.btn-lg{min-height:52px}
.view:has(.login-shell){max-width:1120px}
.login-shell{display:grid;grid-template-columns:minmax(0,.92fr) minmax(380px,1.08fr);gap:54px;align-items:start;padding:26px 0 50px}
.login-intro{position:sticky;top:100px;padding:22px 0}
.login-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid #CFE3D6;border-radius:999px;background:var(--green-soft);color:var(--green-dark);font-size:.75rem;font-weight:650}
.login-intro h1{font-family:var(--font-display);font-size:clamp(3rem,6vw,4.9rem);line-height:.96;letter-spacing:-.03em;margin:24px 0 20px;color:var(--ink)}
.login-intro h1 em{display:block;font-style:italic;color:var(--green-dark)}
.login-intro>p{max-width:31rem;color:var(--ink-soft);font-size:1.02rem;line-height:1.7}
.login-benefits{display:flex;flex-direction:column;gap:9px;margin-top:26px;color:var(--ink-soft);font-size:.88rem}
.login-benefits span{display:flex;align-items:center;gap:9px}
.login-benefits span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.login-panel{display:grid;gap:12px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 14px 34px rgba(18,63,39,.08)}
.login-card h2{font-family:var(--font-display);font-size:1.45rem;margin:0 0 16px}
.login-loading{padding:18px 0;color:var(--muted);font-size:.9rem}
.login-assurance{display:grid;gap:4px;margin-top:16px;padding:12px 14px;border:1px solid #D9E7DE;border-radius:12px;background:#F5FAF6}
.login-assurance strong{color:var(--green-dark);font-size:.8rem}
.login-assurance span{color:var(--muted);font-size:.74rem;line-height:1.4}
.login-actions{display:flex;gap:10px;flex-wrap:wrap}
.login-actions .btn-primary{flex:1}
.role-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:4px}
.role-switch a{display:flex;flex-direction:column;gap:2px;min-height:72px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;transition:border-color .15s,background .15s}
.role-switch a:hover{border-color:var(--green);background:var(--green-soft);text-decoration:none}
.role-choice{display:flex;flex-direction:column;gap:2px;min-height:72px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.role-choice:hover{border-color:var(--green);background:var(--green-soft)}
.role-choice:disabled{opacity:.55;cursor:not-allowed;background:var(--paper)}
.role-choice span{font-weight:700;font-size:.82rem}
.role-choice small{color:var(--muted);font-size:.68rem;line-height:1.3}
.role-switch span{font-weight:700;font-size:.82rem}
.role-switch small{color:var(--muted);font-size:.68rem;line-height:1.3}
.student-dashboard{display:grid;gap:14px}
.student-dashboard .card{box-shadow:none}
.student-safety{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border:1px solid #CFE3D6;border-radius:12px;background:var(--green-soft);color:var(--green-dark);font-size:.78rem}
.student-safety b{font-weight:750}
.student-safety span:last-child{font-family:var(--font-mono);font-size:.72rem;color:#42634A}
@media(max-width:820px){.login-shell{grid-template-columns:1fr;gap:24px;padding-top:10px}.login-intro{position:static;padding:8px 0 0}.login-intro h1{font-size:clamp(3rem,13vw,4.4rem)}.login-benefits{display:none}.login-card{padding:20px}}
@media(max-width:520px){.role-switch{grid-template-columns:1fr}.role-switch a{min-height:58px}.login-actions{display:grid}.login-actions .btn{width:100%}.app-top .wrap{padding-inline:14px}.wallet-pill{max-width:92px}.view{padding-inline:13px}}
@media(max-width:640px){.view{padding:14px 12px 88px}.card{padding:18px}}
</style>
</head>

function applyI18n(){

/* ═══ konto: portfel Solana / Gość / Role ═══ */
function isValidSolanaAddress(a){ return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(String(a||'').trim()); }
function guestWallet(){
  let g = null;
  try{ g = localStorage.getItem('rp_app_guest'); }catch(e){}
  if(!g){
    const abc = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    let s = 'G';
    const rnd = (crypto.getRandomValues ? crypto.getRandomValues(new Uint32Array(43)) : Array.from({length:43},()=>Math.floor(Math.random()*abc.length)));
    for(let i=0;i<43;i++) s += abc[rnd[i] % abc.length];
    g = s;
    try{ localStorage.setItem('rp_app_guest', g); }catch(e){}
  }
  return g;
}
function getWallet(){ try{ return (localStorage.getItem('rp_app_wallet')||'').trim(); }catch(e){ return ''; } }
function getEmail(){ try{ return (localStorage.getItem('rp_app_email')||'').trim(); }catch(e){ return ''; } }
function setEmail(email){ try{ email ? localStorage.setItem('rp_app_email', String(email).trim()) : localStorage.removeItem('rp_app_email'); }catch(e){} }
function getRole(){ try{ return (localStorage.getItem('rp_app_role')||'user').trim(); }catch(e){ return 'user'; } }
function setRole(r){ try{ localStorage.setItem('rp_app_role', r); }catch(e){} }
function getFirstName(){ try{ return (localStorage.getItem('rp_first')||'').trim(); }catch(e){ return ''; } }
function getLastName(){ try{ return (localStorage.getItem('rp_last')||'').trim(); }catch(e){ return ''; } }
function getDisplayName(){ const fn = getFirstName(); const ln = getLastName(); return (fn + ' ' + ln).trim(); }
function setFirstName(fn){ try{ localStorage.setItem('rp_first', fn.trim()); }catch(e){} }
function setLastName(ln){ try{ localStorage.setItem('rp_last', ln.trim()); }catch(e){} }
function getDob(){ try{ return (localStorage.getItem('rp_app_dob')||'').trim(); }catch(e){ return ''; } }
function setDob(d){ try{ localStorage.setItem('rp_app_dob', d); }catch(e){} }
function getClassCode(){
  try{
    const wallet = getWallet();
    const scoped = wallet ? localStorage.getItem('rp_class_code:'+wallet) : null;
    return (scoped || localStorage.getItem('rp_class_code') || '').trim();
  }catch(e){ return ''; }
}
function setClassCode(c){
  try{
    localStorage.setItem('rp_class_code', c);
    const wallet = getWallet();
    if(wallet) c ? localStorage.setItem('rp_class_code:'+wallet, c) : localStorage.removeItem('rp_class_code:'+wallet);
  }catch(e){}
}
function onboardingDone(){ return localStorage.getItem('rp_onboarding_done') === 'true'; }
function setOnboardingDone(){ localStorage.setItem('rp_onboarding_done', 'true'); }
function hasProfile(){ return getFirstName() && getLastName(); }
function isAdult(){ const dob = getDob(); if(!dob) return false; const age = Math.floor((Date.now() - new Date(dob).getTime()) / (365.25*24*60*60*1000)); return age >= 18; }
function setWallet(w){ try{ w ? localStorage.setItem('rp_app_wallet', w) : localStorage.removeItem('rp_app_wallet'); }catch(e){} paintWallet(); }
function paintWallet(){
  const w = getWallet(), el = document.getElementById('walletPill');
  if(el) el.innerHTML = w
    ? `<a href="#/konto" title="${esc(w)}" style="text-decoration:none;color:inherit">● ${esc(w.slice(0,4))}…${esc(w.slice(-4))}</a>`
    : `<a href="#/" style="text-decoration:none;color:inherit">${L('niezalogowany','not signed in')}</a>`;
  const nav = document.getElementById('bottomNav');
  if(nav) nav.style.display = w ? 'flex' : 'none';
}
const SECRET_KEYS = ['correctAnswer','correctAnswers','correctOrder','errorIndex','expectedMeaning','correctText'];
function stripSecrets(ch){ const c = Object.assign({}, ch); SECRET_KEYS.forEach(k => delete c[k]); return c; }

function nav(hash){ location.hash = hash; }
function goHome(){
  const h = (location.hash||'').replace('#','');
  if(h==='' || h==='/' || h==='katalog'){ route(); }
  else { location.hash = '#/'; }
}
function afterLogin(){
  if(!hasProfile() && !onboardingDone()) nav('#/profil');
  else if(getRole()==='user') nav('#/role');
  else goHome();
}
function updateNav(){
  const h = (location.hash||'').replace('#','');
  const w = getWallet();
  const role = getRole();
  const tabs = document.querySelectorAll('#bottomNav a');
  tabs.forEach(a => {
    const tab = a.dataset.tab;
    let active = false;
    if(tab==='katalog' && (h===''||h==='/')) active = true;
    if(tab==='dowody' && h.startsWith('dowody')) active = true;
    if(tab==='nagrody' && h.startsWith('nagrody')) active = true;
    a.classList.toggle('active', active);
    // show/hide based on role
    if(tab==='nagrody'){
      a.style.display = (w && (role==='user' || role==='publisher')) ? 'flex' : 'none';
    }
    if(tab==='student'){
      a.style.display = (w && (role==='student' || role==='reader')) ? 'flex' : 'none';
    }
    if(tab==='teacher'){
      a.style.display = (w && (role==='teacher' || role==='publisher')) ? 'flex' : 'none';
    }
  });
  // publisher tab — always visible (panel is coming soon)
  const pubTab = document.querySelector('#bottomNav a[data-tab="wydawca"]');
  if(pubTab) pubTab.style.display = w ? 'flex' : 'none';
  // teacher tab visibility
  const teachTab = document.querySelector('#bottomNav a[data-tab="teacher"]');
  if(teachTab) teachTab.style.display = (w && (role==='teacher' || role==='publisher')) ? 'flex' : 'none';
}
window.addEventListener('hashchange', () => { updateNav(); route(); });

/* ═══ router ═══ */
function route(){
  const h = (location.hash||'').replace('#','');
  if(!location.hash.startsWith('#/quiz/')) document.body.classList.remove('quiz-active');
  if(!location.hash.startsWith('#/ttest/')) stopStudentProctor();
  const seg = h.split('/').filter(Boolean);
  const w = getWallet();
  const role = getRole();

  // Require wallet for all app routes except login
  if(!w && seg.length > 0 && seg[0] !== 'login'){
    return nav('#/');
  }

  // Coming soon: teacher & student (old unfinished panels are no longer reachable)
  if(seg[0]==='teachers') return renderTeacher();
  if(seg[0]==='student') return renderStudentPanel();
  if(seg[0]==='role') return renderRolePicker();
  if(seg[0]==='publisher') return renderPublisherComingSoon();
  if(seg[0]==='teacher' || (seg[0]==='app' && seg[1]==='teacher')){
    if(role === 'teacher' || role === 'publisher') return renderTeacherPanel();
    return renderAccessDenied();
  }
  if(seg[0]==='app' && seg[1]==='student'){
    if(role === 'student' || role === 'reader') return nav('#/');
    return renderAccessDenied();
  }

  if(seg.length === 0 || seg[0]==='' || seg[0]==='katalog'){
    return w ? renderKatalog() : renderLogin();
  }
  if(seg[0]==='teacher-panel') return renderTeacherPanel();
  if(seg[0]==='dowody') return renderDowody();
  if(seg[0]==='konto') return renderKonto();
  if(seg[0]==='profil') return renderProfil();
  if(seg[0]==='nagrody') return renderNagrody();
  if(seg[0]==='book' && seg[1]) return renderBook(seg[1]);
  if(seg[0]==='chapter' && seg[1] && seg[2]) return renderChapter(seg[1], decodeURIComponent(seg[2]));
  if(seg[0]==='quiz' && seg[1]) return renderQuiz(seg[1]);
  if(seg[0]==='ttest' && seg[1]) return renderTestRun(seg[1]);
  if(seg[0]==='result') return renderResult();
  if(seg[0]==='proofs') return renderDowody();
  return w ? renderKatalog() : renderLogin();
}

function renderRolePicker(){
  if(!getWallet()){ nav('#/'); return; }
  const email = getEmail();
  const domain = String(email).split('@')[1]?.toLowerCase() || '';
  const personalDomains = new Set(['gmail.com','outlook.com','hotmail.com','yahoo.com','icloud.com','proton.me','protonmail.com']);
  const schoolEmail = domain && !personalDomains.has(domain);
  const choose = async role=>{
    if(role === 'teacher' && !schoolEmail){
      toast({type:'err', text:'Do panelu nauczyciela użyj adresu e-mail szkoły.'});
      return;
    }
    setRole(role);
    if(role === 'teacher'){
      try{
        await api('/api/users', {method:'POST', body:JSON.stringify({walletAddress:getWallet(), displayName:getDisplayName(), email, role:'teacher'})});
      }catch(e){
        setRole('user');
        toast({type:'err', text:'Nie udało się zweryfikować konta nauczyciela: '+e.message});
        return;
      }
      localStorage.setItem('rp_teacher_wallet', getWallet());
      window.location.href = '/teacher/';
      return;
    }
    if(role === 'publisher'){ window.location.href = '/publisher/'; return; }
    if(role === 'student'){ nav('#/student'); return; }
    nav('#/');
  };
  view.innerHTML = `<div style="max-width:720px;margin:20px auto">
    <div class="card" style="text-align:center;padding:28px 22px">
      <p class="rp-kicker">Twoje konto</p>
      <h1 class="rp-h2" style="font-size:2rem">Jesteś…</h1>
      <p class="muted" style="max-width:34rem;margin:10px auto 22px">Wybierz rolę, pod którą chcesz korzystać z ReadProof. Możesz zmienić ją później w ustawieniach.</p>
      <div class="role-switch" style="grid-template-columns:repeat(3,1fr);text-align:left">
        <button class="role-choice" data-role="student"><span>Uczeń</span><small>Klasy, testy i wyniki</small></button>
        <button class="role-choice" data-role="teacher" ${schoolEmail?'':'disabled'}><span>Nauczyciel</span><small>${schoolEmail?'Testy, klasy i oceny':'Wymaga e-maila szkoły'}</small></button>
        <button class="role-choice" data-role="publisher"><span>Wydawca</span><small>Kampanie i nagrody</small></button>
      </div>
      <p class="muted" style="font-size:.75rem;margin:16px 0 0">${email?'Zalogowano jako '+esc(email):'Panel nauczyciela wymaga zweryfikowanego adresu e-mail szkoły.'}</p>
    </div>
  </div>`;
  view.querySelectorAll('[data-role]').forEach(button=>button.addEventListener('click',()=>choose(button.dataset.role)));
}

function clearPrivyStorage(){
  // Privy trzyma sesję w localStorage — usuwamy te keys, bo po nawigacji
  // provider potrafi być odmontowany i window.__privy.logout bywa martwą referencją
  try{
    const drop = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && /privy/i.test(k)) drop.push(k);
    }
    drop.forEach(k => localStorage.removeItem(k));
  }catch(e){}
}
function logout(){
  // 1) próbuj normalnego wylogowania Privy (jak provider żyje)
  let p = null;
  try{ if(window.__privy && typeof window.__privy.logout === 'function'){ p = window.__privy.logout(); if(p && typeof p.catch==='function') p.catch(()=>{}); } }catch(e){}
  try{ window.__privy = undefined; }catch(e){}
  // 2) defensywnie czyść lokalną sesję Privy → po odświeżeniu nie wróci zalogowany
  clearPrivyStorage();
  privyMountedUser = false;
  setWallet('');
   setRole('user');
   localStorage.removeItem('rp_teacher_wallet');
   localStorage.removeItem('rp_app_email');
   localStorage.removeItem('rp_onboarding_done');
  localStorage.removeItem('rp_app_last_result');
  goHome();
  // 3) gdyby goHome trafiło na widok logowania, zamontuj świeży provider / nie-authenticated
  setTimeout(()=>{ if(!getWallet()) mountPrivyUser(); }, 80);
}

let privyMountedUser = false;
async function mountPrivyUser(){
  if(privyMountedUser) return; privyMountedUser = true;
  const box = document.getElementById('privyUserRoot'); if(!box) return;
  const t = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  try{
    const [{default:React},{createRoot},privy,privySol] = await Promise.all([
      t(import('https://esm.sh/react@18.3.1'), 25000),
      t(import('https://esm.sh/react-dom@18.3.1/client'), 25000),
      t(import('https://esm.sh/@privy-io/react-auth@3.16.0?deps=react@18.3.1,react-dom@18.3.1'), 60000),
      t(import('https://esm.sh/@privy-io/react-auth@3.16.0/solana?deps=react@18.3.1,react-dom@18.3.1'), 60000)
    ]);
    const e = React.createElement;
     function pickAddr(user){
      if(!user) return '';
      if(user.wallet && user.wallet.address) return user.wallet.address;
      if(user.linkedAccounts && user.linkedAccounts.length){
        const wa = user.linkedAccounts.find(a => (a.type==='wallet'||a.type==='smart_wallet') && a.address);
        if(wa) return wa.address;
      }
      if(user.solanaWallet && user.solanaWallet.address) return user.solanaWallet.address;
      return '';
    }
    function pickEmail(user){
      if(!user) return '';
      if(user.email) return user.email;
      if(user.primaryEmail) return user.primaryEmail;
      if(user.linkedAccounts && user.linkedAccounts.length){
        const mail = user.linkedAccounts.find(a => (a.type==='email' || a.type==='email_address') && a.address);
        if(mail) return mail.address;
      }
      return '';
    }
    function Inner(){
      const ctx = privy.usePrivy();
      try{ window.__privy = window.__privy || {}; window.__privy.logout = ctx.logout; window.__privy.authenticated = ctx.authenticated; }catch(e){}
      const {ready, authenticated, user, login} = ctx;
      const w = privySol && privySol.useWallets ? privySol.useWallets() : {ready:false, wallets:[]};
      const swAddr = (((w.wallets || [])[0]) || {}).address || '';
      const [status, setStatus] = React.useState('');
      React.useEffect(()=>{
        if(!authenticated) return;
        let cancelled = false, tries = 0;
        const tick = ()=>{
          if(cancelled) return;
          const addr = pickAddr(user) || swAddr || '';
          if(addr){ setWallet(addr); const email=pickEmail(user); if(email) setEmail(email); setStatus('Zalogowano ✓'); afterLogin(); return; }
          if(tries++ < 40){ setStatus('Tworzenie portfela… ('+tries+')'); setTimeout(tick, 400); }
          else setStatus('Zalogowano, ale portfel jeszcze się tworzy. Odśwież za chwilę.');
        };
        tick();
        return ()=>{ cancelled = true; };
      },[authenticated, user, swAddr]);
      if(!ready) return e('span',{className:'muted'},'Inicjalizacja…');
      if(authenticated) return e('span',{className:'muted'}, status || 'Zalogowano — otwieranie…');
      return e('button',{className:'btn btn-primary btn-lg',style:{width:'100%'},onClick:()=>login()},'Zaloguj e-mailem lub kontem społecznościowym');
    }
    function App(){ return e(privy.PrivyProvider,{appId:PRIVY_DEFAULT_APP_ID,config:{appearance:{walletChainType:'solana-only'},loginMethods:['email','google'],embeddedWallets:{solana:{createOnLogin:'users-without-wallets'}}},children:e(Inner)}); }
    createRoot(box).render(e(App));
  }catch(err){ privyMountedUser=false; if(box) box.innerHTML = `<p class="muted">Logowanie przez Privy chwilowo niedostępne (${esc(err.message||err)}). Odśwież stronę i spróbuj ponownie.</p>`; }
}

async function startSession(b, c, stream){

}
function answeredIds(){ const a=(SESSION&&SESSION.answers)||{}; return new Set(Object.keys(a)); }
function currentQuestion(){

function snapshotDraft(){

function restoreDraft(d){

const TYPE_LABEL = {multiple_choice:'Wybór', true_false:'Prawda / fałsz', multiple_select:'Wybierz wszystkie', open_question:'Otwarte', why_question:'Dlaczego', ordering:'Uporządkuj', who_said:'Kto to powiedział', match:'Dopasuj', what_next:'Co dalej', find_error:'Znajdź błąd'};

async function renderDowody(){
  const w = getWallet(); view.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
      <div><a class="btn btn-ghost btn-sm" href="#/">← ${L('Katalog','Catalog')}</a><h1 class="rp-h2" style="font-size:1.6rem;margin-top:12px">${L('Moje dowody.','My proofs.')}</h1></div>
      <button class="btn btn-ghost btn-sm" id="bLogoutDowody">${L('Wyloguj','Log out')}</button>
    </div><div id="pl"><p class="muted">${L('Ładowanie…','Loading…')}</p></div>`;
  document.getElementById('bLogoutDowody').addEventListener('click', logout);
  if(!w){ document.getElementById('pl').innerHTML = `<div class="card rp-center"><p class="muted">${L('Zaloguj się portfelem, aby zobaczyć swoje dowody i certyfikaty.','Sign in with a wallet to see your proofs and certificates.')}</p><a class="btn btn-primary" href="#/">${L('Konto →','Account →')}</a></div>`; return; }
  let list = [];
  try{ const j = await api('/api/proofs?wallet='+encodeURIComponent(w)); list = Array.isArray(j)?j:(j.proofs||[]); }catch(e){}
  let local = []; try{ local = JSON.parse(localStorage.getItem('rp_app_proofs')||'[]'); }catch(e){}
  const seen = new Set(list.map(p=>p.proofHash)); local.forEach(p=>{ if(p.proofHash&&!seen.has(p.proofHash)) list.push(p); });
  const exOf = p=> p.explorerUrl || (p.txSignature ? 'https://explorer.solana.com/tx/'+p.txSignature+'?cluster=devnet' : '');
  // mapa proofHash → certyfikat rozdziału (certHash === proofHash) + certyfikaty za całe lektury
  let certsByProof = {}; let bookCerts = [];
  try{ const cj = await api('/api/certificates?wallet='+encodeURIComponent(w)); const cs = (cj && cj.certificates) || []; cs.forEach(c=>{ if(c.kind==='book') bookCerts.push(c); else if(c.certHash) certsByProof[c.certHash] = c; }); }catch(e){}
  local.forEach(p=>{ if(p.certId && !certsByProof[p.proofHash]) certsByProof[p.proofHash] = { id: p.certId, verified: true }; });
  const verified = p => ['Reading Verified','Comprehension Verified','verified'].includes(p.status);
  const rows = list.slice(0,30).map(p=>{
    const bk = findBook(p.bookId); const bkName = bk ? tTitle(bk) : p.bookId;
    const ex = exOf(p);
    const cert = certsByProof[p.proofHash];
    return `<div class="hist-row"><span class="pill ${verified(p)?'ok':'mut'}">${esc(String(p.score))}/${esc(String(p.total))}</span><span style="flex:1"><b>${esc(bkName)}</b><br><span class="muted" style="font-size:.78rem">${esc(plChapterTitle(p.bookId, p.chapterId))} · ${esc((p.timestamp||'').slice(0,10))}${cert?` · <span class="pill ok">cert ${esc(cert.id||'')}</span>`:''}</span></span>${p.proofHash?`<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="/verify/?proof=${esc(encodeURIComponent(p.proofHash))}">${L('Sprawdź','Review')}</a>`:''}${ex?`<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="${esc(ex)}">${L('On-chain','On-chain')} ↗</a>`:''}</div>`;
  }).join('');
  // certyfikaty za całe lektury
  let whole = '';
  try{
    const books = await api('/api/books'); const catalog = Array.isArray(books)?books:[];
    const groups = {};
    list.forEach(p=>{ if(verified(p) && p.bookId && p.chapterId){ groups[p.bookId] = groups[p.bookId]||{}; groups[p.bookId][p.chapterId] = p; } });
    const candidates = catalog.map(b=>{ const g = groups[b.id]||{}; return { book: b, count: Object.keys(g).length, all: (b.chapters||[]).every(ch=>g[ch.id]) }; }).filter(c=>c.count>0);
    if(candidates.length){
      const full = candidates.filter(c=>c.all); const partial = candidates.filter(c=>!c.all);
      const chips = b=>{ const g = groups[b.id]||{}; return ((b.chapters||[]).map(ch=>{ const passed=!!g[ch.id]; const ttl=plChapterTitle(b.id, ch.id)||ch.title||ch.id; return `<span class="pill ${passed?'ok':'mut'}" style="margin:2px 4px 2px 0;font-size:.72rem">${passed?'✓ '+esc(ttl):esc(ttl)}</span>`; }).join('')); };
      const remainCount = b=> (b.chapters||[]).length - (groups[b.id]?Object.keys(groups[b.id]).length:0);
      const bookCard = c=>`<div class="book-row" style="align-items:flex-start"><div class="t"><b>${esc(tTitle(c.book))}</b> ${c.all?`<span class="muted">— ${L('wszystkie zaliczone','all passed')}</span>`:`<span class="muted">— ${L('zostało:','remaining:')} ${esc(remainCount(c.book))} ${L('rozdziałów','chapters')}</span>`}<br><div style="margin-top:6px">${chips(c.book)}</div></div>${c.all?(()=>{ const bc = bookCerts.find(x=>x.bookId===c.book.id); return bc ? `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="/verify/?id=${esc(encodeURIComponent(bc.id))}">cert: ${esc(bc.id)}</a>` : `<button class="btn btn-primary btn-sm" data-earn="${esc(c.book.id)}">${L('Odbierz certyfikat','Earn certificate')}</button>`; })():''}</div>`;
      whole = `<div class="card" style="margin-top:16px"><p class="rp-kicker">${L('Certyfikaty za całe lektury','Whole-book certificates')}</p>` +
        `<p class="muted" style="font-size:.8rem;margin:4px 0 10px">${L('Gdy zaliczysz wszystkie rozdziały lektury, możesz odebrać certyfikat za całą książkę.','When you pass all chapters of a book, you can collect its whole-book certificate.')}</p>` +
        (full.length ? full.map(bookCard).join('') : '') +
        (full.length && partial.length ? `<div style="border-top:1px dashed var(--line);margin:8px 0"></div>` : '') +
        (partial.length ? partial.map(bookCard).join('') : '') +
        `</div>`;
    }
  }catch(e){}
  document.getElementById('pl').innerHTML = (list.length ? rows : `<p class="muted">${L('Brak dowodów. Ukończ pierwszy quiz.','No proofs yet. Finish your first quiz.')}</p>`) + whole;
  document.querySelectorAll('[data-earn]').forEach(b=>{ b.addEventListener('click', async ()=>{
    const bid = b.dataset.earn; b.disabled = true; b.textContent = '…';
    try{
      const r = await api('/api/books/'+encodeURIComponent(bid)+'/certificate', { method:'POST', body: JSON.stringify({ wallet: w }) });
      if(r && r.cert){
        b.outerHTML = `<a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="/verify/?id=${esc(encodeURIComponent(r.cert.id))}">cert: ${esc(r.cert.id)}</a>`;
        toast({ text: L('Certyfikat za całą lekturę wydany!','Whole-book certificate issued!') + ' ' + r.cert.id, type:'ok' });
      } else { b.disabled = false; b.textContent = L('Odbierz certyfikat','Earn certificate'); toast({ text: L('Nie udało się wydać certyfikatu.','Could not issue certificate.'), type:'err' }); }
    }catch(e){
      b.disabled = false; b.textContent = L('Odbierz certyfikat','Earn certificate');
      const missing = (e.body && e.body.missing) || [];
      toast({ text: L('Najpierw zweryfikuj wszystkie rozdziały.','Verify all chapters first.') + (missing.length?' — '+missing.join(', '):''), type:'err' });
    }
  }); });
}

function mountWaitlistForm(role){
  const form = document.getElementById('wlForm');
  if(!form) return;
  const msgBox = document.getElementById('wlMsg');
  const msg = (cls, txt)=>{ if(!msgBox) return; msgBox.className = 'wl-msg '+cls; msgBox.textContent = txt; };
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = (document.getElementById('wlEmail')?.value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ msg('err','Podaj poprawny adres e-mail.'); return; }
    const body = { email, role, name:(document.getElementById('wlName')?.value||'').trim()||'', website:(document.getElementById('wlWebsite')?.value||'') };
    const btn = form.querySelector('button[type=submit]') || form.querySelector('button');
    btn.disabled = true;
    try {
      const j = await ReadProofAPI.request('/api/waitlist', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
      const pos = j.position||0;
      msg('ok', (j.already ? ('Ten e-mail jest już na liście (miejsce '+pos+'). Damy znać, gdy ruszymy.') : ('Jesteś na liście oczekujących (miejsce '+pos+'). Damy znać, gdy ruszymy.')));
      form.style.display = 'none';
    } catch(err) {
      msg('err', 'Nie udało się zapisać — spróbuj ponownie za chwilę. ('+err.message+')');
    }
    btn.disabled = false;
  });
}

async function renderTeacherStats(){

      api('/api/teacher/challenges?teacher='+encodeURIComponent(w), {headers:{'x-user-id':w}})

    const students = cls.reduce((a,c)=>a+((c.students&&c.students.length)||0),0);
    const stats = [
      {n: cls.length, l:'Klasy'},
      {n: list.length, l:'Testy'},
      {n: list.filter(c=>c.status==='active').length, l:'Aktywne'},
      {n: students, l:'Uczniowie'}
    ];
    document.getElementById('teStats').innerHTML =
      `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">`
      + stats.map(s=>`<div class="card" style="padding:14px;text-align:center">
          <div style="font-family:var(--font-display);font-size:1.5rem;font-weight:800;color:var(--green-dark)">${s.n}</div>

document.getElementById('teStats').style.display = '';

}

async function loadTeacherProofs(){
  const list = document.getElementById('proofList');
  if(!list) return;
  let proofs;
  try{ proofs = await api('/api/proofs'); }
  catch(e){ list.innerHTML = '<p class="muted">Błąd ładowania dowodów.</p>'; return; }
  const arr = Array.isArray(proofs) ? proofs : (proofs.proofs||[]);
  if(!arr.length){ list.innerHTML = '<p class="muted">Brak zweryfikowanych dowodów.</p>'; return; }
  const bookTitle = id => { const b = BOOKS.find(x=>x.id===id); return (b&&b.title)||String(id||'—'); };
  const chapTitle = (bid, cid) => { const b = BOOKS.find(x=>x.id===bid); const c = b&&(b.chapters||[]).find(x=>x.id===cid); return (c&&(c.title||c.id))||String(cid||'—'); };
  const who = p => String(p.userId || p.walletAddress || '').slice(0,12);
  const fmt = ts => String(ts||'').slice(0,16).replace('T',' ');

function testModeLabel(m){ const d = TEXT_MODES.find(x=>x.m===m); return d ? d.name : (m||'—'); }
function typeLabel(t){ return ({multiple_choice:'Wielokrotny wybór', what_next:'Co będzie dalej?', true_false:'Prawda / Fałsz', multiple_select:'Zaznacz wszystkie', open_question:'Rozwinięta odpowiedź', why_question:'Dlaczego?', find_error:'Znajdź błąd', ordering:'Uporządkuj', ranking:'Ranking', match:'Dopasuj', who_said:'Kto powiedział?'}[t] || t || ''); }

async function getPdfBlob(url){
  const r = await fetch(ReadProofAPI.url(url), {headers:{'x-user-id':getWallet()}});
  if(!r.ok) throw new Error('Nie udało się pobrać PDF.');

function downloadBlob(blob, fname){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(u); a.remove(); }, 3000);
}

let PP_QS = [];
function ocrVal(ocr, id){
  const v = ocr[id];
  if(v && typeof v==='object' && 'answer' in v) return v.answer;
  return v;
}
function renderPPReview(el, paper){
  PP_QS = (paper&&paper.questions)||[];
  const ocr = (paper&&paper.ocrAnswers)||{};
  el.innerHTML = `${paper.engineMissing ? '<p class="muted" style="color:#B3261E">OCR niedostępny na serwerze — wpisz odpowiedzi ręcznie.</p>' : '<p class="muted">Rozpoznano z OCR — zweryfikuj i popraw odpowiedzi.</p>'}
    <div class="card" style="padding:16px">
      <p class="rp-kicker">Uczeń: ${esc(PAPER_SES.studentName)}</p>
      <div id="ppQs"></div>
      <button class="btn btn-primary btn-lg" id="bPPConfirm" style="width:100%;margin-top:14px">Potwierdź ocenę</button>
      <div id="ppGrade" style="margin-top:12px"></div>
    </div>`;
  const qsEl = document.getElementById('ppQs');
  qsEl.innerHTML = PP_QS.map((q,i)=>{
    const prev = ocrVal(ocr, q.id);
    let ctrl;
    if(q.type==='multiple_choice'||q.type==='true_false'||q.type==='what_next'){
      ctrl = (q.options||[]).map((o,oi)=>{
        return `<button type="button" class="ans-opt ${prev===oi?'active':''}" data-i="${i}" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`;
      }).join('');
    }else if(q.type==='multiple_select'){
      const sel = Array.isArray(prev)?prev:[];
      ctrl = (q.options||[]).map((o,oi)=>{
        return `<label style="display:flex;gap:8px;align-items:center;padding:8px 4px;cursor:pointer;font-size:.9rem"><input type="checkbox" data-i="${i}" data-oi="${oi}" ${sel.includes(oi)?'checked':''}> ${String.fromCharCode(65+oi)}. ${esc(o)}</label>`;
      }).join('');
    }else{
      ctrl = `<textarea class="big-input" data-i="${i}" rows="3" placeholder="Odpowiedź ucznia…">${esc(typeof prev==='string'?prev:'')}</textarea>`;
    }
    return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px">
      <div style="font-weight:600;font-size:.9rem">${i+1}. ${esc(q.question)} <span class="muted" style="font-weight:400">[${typeLabel(q.type)}]</span></div>
      <div style="margin-top:8px">${ctrl}</div>
    </div>`;
  }).join('');
  qsEl.querySelectorAll('.ans-opt').forEach(btn=>btn.addEventListener('click', ()=>{
    qsEl.querySelectorAll('.ans-opt[data-i="'+btn.dataset.i+'"]').forEach(x=>x.classList.toggle('active', x===btn));
  }));
  document.getElementById('bPPConfirm').addEventListener('click', ()=>ppConfirm());
}
function collectPaperAnswers(){
  const a = {};
  PP_QS.forEach((q,i)=>{
    if(q.type==='multiple_choice'||q.type==='true_false'||q.type==='what_next'){
      const act = document.querySelector('.ans-opt[data-i="'+i+'"].active');
      a[q.id] = act ? Number(act.dataset.oi) : null;
    }else if(q.type==='multiple_select'){
      const sel = [];
      document.querySelectorAll('input[type=checkbox][data-i="'+i+'"]').forEach(c=>{ if(c.checked) sel.push(Number(c.dataset.oi)); });
      a[q.id] = sel.length ? sel : null;
    }else{
      const ta = document.querySelector('textarea[data-i="'+i+'"]');
      const v = ta ? ta.value.trim() : '';
      a[q.id] = v || null;
    }
  });
  return a;
}
async function ppConfirm(){
  const w = getWallet();
  const answers = collectPaperAnswers();
  const btn = document.getElementById('bPPConfirm');
  btn.disabled = true; btn.textContent = 'Ocenianie…';
  try{
    const z = await api('/api/teacher/paper/'+PAPER_SES.pid+'/confirm', {method:'POST', body:JSON.stringify({teacher:w, studentName:PAPER_SES.studentName, answers})});
    const g = z.grading || {};
    const gs = g.status || (z.attempt && z.attempt.status) || 'Passed';

    document.getElementById('ppGrade').innerHTML = `<div class="card" style="${passed?'background:var(--green-soft);border-color:var(--green)':'background:#FDE8E8;border-color:#E5B8B8'};padding:16px;text-align:center">

      <div class="muted">${g.pct ?? 0}% · ${gs}</div>
      <a class="btn btn-ghost btn-sm" href="#/teachers/testy/gotowe" style="margin-top:10px">← Wróć do testów (wynik w tabeli)</a>
    </div>`;
    btn.remove();
  }catch(e){ btn.disabled=false; btn.textContent='Potwierdź ocenę'; alert(e.message); }
}

function poolAnswerText(q){
  try{
    if((q.type==='multiple_choice'||q.type==='what_next') && Array.isArray(q.options) && q.correctAnswer!=null && q.options[q.correctAnswer]) return String(q.options[q.correctAnswer]);
    if(q.type==='true_false') return q.correctAnswer===0 ? 'Prawda' : 'Fałsz';
    if(q.type==='multiple_select' && Array.isArray(q.options)) return (q.correctAnswers||[]).map(i=>q.options[i]).join(', ');
    if((q.type==='open_question'||q.type==='why_question') && q.expectedMeaning) return String(q.expectedMeaning).slice(0,40);
    return '';
  }catch(e){ return ''; }
}
function renderPickInfo(S){
  const info = document.getElementById('tePickInfo');
  if(!info) return;
  info.innerHTML = `Wybrano <b>${S.picked.size + S.manual.length}</b> pytań.` + (S.manual.length? ' <span style="font-size:.78rem">'+ S.manual.map((q,i)=>`<span class="rm-man" data-i="${i}" style="display:inline-block;background:var(--green-soft);border:1px solid var(--green);border-radius:999px;padding:2px 10px;margin:2px;cursor:pointer">✕ ${esc(String(q.question||'').slice(0,26))}</span>`).join('') +'</span>' : '');
  info.querySelectorAll('.rm-man').forEach(sp=>sp.addEventListener('click', ()=>{
    S.manual.splice(Number(sp.dataset.i),1); renderPickInfo(S);
  }));
}
function renderPoolList(S, el){
  el.innerHTML = `<div class="muted" style="margin:6px 0">Pula rozdziału (${S.pool.length} pytań) — zaznacz te, które wchodzą do testu:</div>`+
    S.pool.map((q,i)=>`<label class="q-chk ${S.picked.has(i)?'checked':''}">
      <input type="checkbox" data-i="${i}" ${S.picked.has(i)?'checked':''} style="margin-top:4px">
      <span style="flex:1;font-size:.85rem">${esc(q.question)} <span class="muted">[${typeLabel(q.type)}] · odp: ${esc(poolAnswerText(q))}</span></span>
    </label>`).join('');
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change', ()=>{
    const i = Number(cb.dataset.i);
    cb.checked ? S.picked.add(i) : S.picked.delete(i);
    cb.closest('.q-chk').classList.toggle('checked', cb.checked);
    renderPickInfo(S);
  }));
}
function collectManualQuestion(){
  const type = document.getElementById('mqType').value;
  const question = document.getElementById('mqText').value.trim();
  if(!question){ alert('Podaj treść pytania.'); return null; }
  if(type==='open_question' || type==='why_question'){
    const meaning = document.getElementById('mqMeaning').value.trim();
    if(!meaning){ alert('Podaj liczącą się frazę (expectedMeaning).'); return null; }
    return {type, question, expectedMeaning: meaning};
  }
  const options = document.getElementById('mqOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(options.length<2){ alert('Podaj co najmniej 2 odpowiedzi.'); return null; }
  if(type==='true_false'){
    const v = String(document.getElementById('mqCorrect').value||'').trim().toLowerCase();
    const tf = ['p','prawda','tak','t','0'].includes(v) ? 0 : 1;
    return {type, question, correctAnswer: tf, options};
  }
  const letters = String(document.getElementById('mqCorrect').value||'').trim().toUpperCase().split(',').map(s=>s.trim()).filter(Boolean);
  const idxs = letters.map(l=>{ const c=l.charCodeAt(0); return (c>=65&&c<=90)?c-65:-1; }).filter(i=>i>=0);
  if(!idxs.length || idxs.some(i=>i>=options.length)){ alert('Poprawna odpowiedź nie pasuje do listy A-D.'); return null; }
  if(type==='multiple_select') return {type, question, options, correctAnswers: idxs};
  if(idxs.length>1){ alert('Wybór pojedynczy — podaj jedną literę.'); return null; }
  return {type, question, options, correctAnswer: idxs[0]};
}
async function loadPoolForEdit(S, w, editId, ch){
  const chSel = document.getElementById('teChapter');
  S.chapter = chSel.value;
  const poolEl = document.getElementById('tePool');
  if(!S.chapter){ poolEl.innerHTML = '<p class="muted">Wybierz rozdział.</p>'; return; }
  poolEl.innerHTML = '<p class="muted">Wczytywanie pytań…</p>';
  let pool = [];
  try{ pool = ((await api('/api/teacher/pool?chapter='+encodeURIComponent(S.chapter), {headers:{'x-user-id':w}}))||{}).pool || []; }
  catch(e){ poolEl.innerHTML = '<p class="muted">Błąd: '+esc(e.message)+'</p>'; return; }
  S.pool = pool;
  if(editId && ch && !S.matched && Array.isArray(ch.questions)){
    S.matched = true;
    const keep = new Set();
    ch.questions.forEach(q=>{
      const i = pool.findIndex(x=>String(x.id)===String(q.id));
      if(i>=0){ S.picked.add(i); keep.add(String(q.id)); }
    });
    S.manual = ch.questions.filter(q=>!keep.has(String(q.id)));
  }
  if(!pool.length){ poolEl.innerHTML = '<p class="muted">Pula rozdziału jest jeszcze pusta (pytania generują się w tle). Spróbuj za chwilę albo dodaj pytania ręcznie poniżej.</p>'; renderPickInfo(S); return; }
  renderPoolList(S, poolEl);
}

let studentProctor = null;
function studentProctoring(){
  const p = studentProctor || {};
  return {tabSwitches:p.tabs||0, pastes:p.pastes||0, fullscreenExits:p.exits||0, copies:p.copies||0, webdriver:!!navigator.webdriver};
}
function stopStudentProctor(){
  if(studentProctor?.stream) studentProctor.stream.getTracks().forEach(track=>track.stop());
  studentProctor = null;
}
function ensureStudentProctorListeners(){
  if(window.__readProofStudentProctor) return;
  window.__readProofStudentProctor = true;
  document.addEventListener('fullscreenchange', ()=>{
    if(!studentProctor || !location.hash.startsWith('#/ttest/') || document.fullscreenElement) return;
    studentProctor.exits++;
    if(studentProctor.exits >= 3){ failStudentAttempt('fullscreen exits'); return; }
    procToast(L('Wróć do pełnego ekranu.','Return to fullscreen.'));
    try{ document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
  });
  document.addEventListener('visibilitychange', ()=>{
    if(!studentProctor || !location.hash.startsWith('#/ttest/') || document.visibilityState !== 'hidden') return;
    studentProctor.tabs++;
    if(studentProctor.tabs >= 3){ failStudentAttempt('tab switches'); return; }
    procToast(L('Nie zmieniaj kart podczas testu.','Do not switch tabs during the test.'));
  });
  ['copy','cut','paste'].forEach(type=>document.addEventListener(type, event=>{
    if(!studentProctor || !location.hash.startsWith('#/ttest/')) return;
    if(!view.contains(event.target)) return;
    event.preventDefault();
    if(type === 'paste') studentProctor.pastes++;
    else studentProctor.copies++;
    procToast(type === 'paste' ? L('Wklejanie zablokowane.','Pasting is blocked.') : L('Kopiowanie zablokowane.','Copying is blocked.'));
  }, true));
  document.addEventListener('contextmenu', event=>{ if(studentProctor && location.hash.startsWith('#/ttest/')) event.preventDefault(); }, true);
  document.addEventListener('keydown', event=>{
    if(!studentProctor || !location.hash.startsWith('#/ttest/')) return;
    const key = (event.key || '').toLowerCase();
    if(key === 'printscreen' || key === 'f12' || ((event.ctrlKey || event.metaKey) && ['c','x','u','s','p','v'].includes(key))){
      event.preventDefault();
      if(key === 'v') studentProctor.pastes++; else studentProctor.copies++;
      procToast(L('Ta akcja jest zablokowana podczas testu.','This action is blocked during the test.'));
    }
  }, true);
  window.addEventListener('beforeunload', event=>{
    if(studentProctor && location.hash.startsWith('#/ttest/')){ event.preventDefault(); event.returnValue = ''; }
  });
}
async function startStudentGuarded(testId){
  if(navigator.webdriver){ toast({type:'err', text:'Nie można uruchomić testu w zautomatyzowanej przeglądarce.'}); return; }
  stopStudentProctor();
  let stream = null;
  try{ stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false}); }catch(e){}
  try{ if(!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(e){}
  const z = await api('/api/student/challenges/'+encodeURIComponent(testId)+'/attempt', {method:'POST', headers:{'x-user-id':getWallet(),'x-class-code':getClassCode()}, body:JSON.stringify({wallet:getWallet(), studentId:getWallet(), classCode:getClassCode(), proctoring:studentProctoring()})});
  studentProctor = {stream, exits:0, copies:0, pastes:0, tabs:0};
  ensureStudentProctorListeners();
  nav('#/ttest/'+z.attempt.id);
}
async function failStudentAttempt(reason){
  if(!studentProctor || !RUN) return;
  const attemptId = RUN.attemptId;
  studentProctor.reason = reason;
  try{
    const z = await api('/api/student/attempts/'+encodeURIComponent(attemptId)+'/submit', {method:'POST', headers:{'x-user-id':getWallet()}, body:JSON.stringify({studentId:getWallet(), fail:true, reason, proctoring:studentProctoring()})});
    stopStudentProctor();
    if(z.attempt) renderTestResult(z.attempt, RUN.challenge, z.attempt.detail || null, null);
  }catch(e){
    stopStudentProctor();
    view.innerHTML = `<div class="card"><h3>Sesja zakończona z powodu naruszenia zasad.</h3><p class="muted">${esc(e.message)}</p><a class="btn btn-ghost" href="#/student">← Panel ucznia</a></div>`;
  }
}

async function loadStudentTests(){
  const box = document.getElementById('studentTests');
  const w = getWallet();
  const classCode = getClassCode();
  if(!classCode){
    box.innerHTML = '<div class="card"><p class="rp-kicker">Testy są prywatne</p><p class="muted">Najpierw dołącz do klasy kodem od nauczyciela.</p><a class="btn btn-primary btn-sm" href="#/student">Dołącz do klasy →</a></div>';
    return;
  }
  let list = [];
  try{ list = ((await api('/api/student/challenges?classCode='+encodeURIComponent(classCode), {headers:{'x-user-id':w,'x-class-code':classCode}}))||{}).challenges || []; }
  catch(e){ box.innerHTML = '<p class="muted">Brak dostępu do testów.</p>'; return; }
  if(!list.length){ box.innerHTML = '<p class="muted">Nauczyciel nie udostępnił jeszcze testów.</p>'; return; }
  const res = ((await api('/api/student/results', {headers:{'x-user-id':w}}).catch(()=>({})))||{}).results || [];
  const done = new Set(res.filter(r=>r.mode==='VIRTUAL').map(r=>r.challengeId));
  const virtual = list.filter(t=>t.canVirtual);
  if(!virtual.length){ box.innerHTML = '<p class="muted">Brak testów w trybie wirtualnym.</p>'; return; }
  box.innerHTML = virtual.map(t=>{
    const isDone = done.has(t.id);
    return `<div class="book-row"><div class="t"><b>${esc(t.title)}</b><br><span class="muted">${esc(t.bookTitle||t.bookId)}${t.chapterTitle?(' · '+esc(t.chapterTitle)):''} · ${t.questionCount} ${L('pytań','questions')}</span></div>
      ${isDone
        ? '<span class="pill ok">Rozwiązany</span>'
        : `<button class="btn btn-primary btn-sm" data-tid="${t.id}">Rozpocznij wirtualny</button>`}
    </div>`;
  }).join('');
  box.querySelectorAll('[data-tid]').forEach(btn=>btn.addEventListener('click', async ()=>{
    btn.disabled = true;
    try{ await startStudentGuarded(btn.dataset.tid); }
    catch(e){ alert(e.message); loadStudentTests(); }
    finally{ btn.disabled = false; }
  }));
}

  if(!res.length){ box.innerHTML = '<p class="muted">Brak wyników — rozwiąż pierwszy test.</p>'; return; }
  box.innerHTML = `<table class="tbl"><thead><tr><th>Test</th><th>Mode</th><th>Score</th><th>Status</th></tr></thead><tbody>`+
    res.slice(0,10).map(r=>`<tr>
      <td>${esc(r.title||'Test')}</td>
      <td>${esc(r.modeLabel||r.mode)}</td>
      <td>${r.score}/${r.maxScore} <span class="muted">(${r.pct}%)</span></td>
      <td>${r.status==='Passed'?'<span class="pill ok">Zaliczony</span>':'<span class="pill" style="background:#FDE8E8;color:#B3261E">Niezaliczony</span>'}</td>
    </tr>`).join('')+`</tbody></table>`;
}

/* ═══ TEST WIRTUALNY: rozwiązywanie ═══ */
let RUN = null;
function fmtDur(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function numEq(v, oi){ return typeof v==='number' && v===oi; }
function questionControls(q){
  const v = RUN.answers[q.id];
  if(q.type==='multiple_choice'||q.type==='true_false'||q.type==='what_next'){
    return (q.options||[]).map((o,oi)=>`<button type="button" class="ans-opt ${numEq(v,oi)?'active':''}" data-kind="opt" data-v="${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('');
  }
  if(q.type==='multiple_select'){
    const sel = Array.isArray(v)?v:[];
    return (q.options||[]).map((o,oi)=>`<label style="display:flex;gap:8px;align-items:center;padding:10px 4px;cursor:pointer;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:.9rem"><input type="checkbox" class="run-chk" data-v="${oi}" ${sel.includes(oi)?'checked':''}> ${String.fromCharCode(65+oi)}. ${esc(o)}</label>`).join('');
  }
  if(q.type==='find_error'){
    return (q.options||[]).map((o,oi)=>`<button type="button" class="ans-opt ${numEq(v,oi)?'active':''}" data-kind="opt" data-v="${oi}">${String.fromCharCode(65+oi)}. ${esc(o)}</button>`).join('');
  }
  if(q.type==='ordering'||q.type==='ranking'){
    const items = q.items||[];
    const cur = Array.isArray(v)&&v.length===items.length ? v : [];
    return `<div class="muted" style="margin-bottom:6px">Ustaw kolejność (element → pozycja 1..n):</div>`+items.map((it,i)=>{
      let oo = `<option value="-1" ${(cur[i]===null||cur[i]===undefined)?'selected':''}>— wybierz —</option>`;
      items.forEach((x,xi)=>{ oo += `<option value="${xi}" ${numEq(cur[i],xi)?'selected':''}>${esc(String(x)).slice(0,36)}</option>`; });
      return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="width:1.5rem;color:var(--muted)">${i+1}.</span><select class="run-ord big-input" data-i="${i}">${oo}</select></div>`;
    }).join('');
  }
  return `<textarea class="run-txt big-input" rows="4" placeholder="Odpowiedź…">${esc(typeof v==='string'?v:'')}</textarea>`;
}
async function renderTestRun(attemptId){
  const w = getWallet(); if(!w){ nav('#/'); return; }
  view.innerHTML = '<p class="muted">Ładowanie testu…</p>';
  let data;
  try{ data = await api('/api/student/attempts/'+encodeURIComponent(attemptId), {headers:{'x-user-id':w}}); }
  catch(e){ view.innerHTML = `<div class="card"><h3>Nie udało się wczytać testu.</h3><p class="muted">${esc(e.message)}</p><a class="btn btn-ghost" href="#/student">← Panel ucznia</a></div>`; return; }
  const attempt = data.attempt, challenge = data.challenge, questions = data.questions||[];
  if(attempt.status === 'graded'){ return renderTestResult(attempt, challenge, attempt.detail); }
  RUN = {
    attemptId, attempt, challenge, questions,
    answers: Object.assign({}, attempt.answers||{}),
    idx: 0, submitLock: false, timer: null, deadline: null
  };
  if(!studentProctor) studentProctor = {stream:null, exits:0, copies:0, pastes:0, tabs:0};
  ensureStudentProctorListeners();
  RUN.deadline = attempt.expiresAt ? new Date(attempt.expiresAt).getTime() : (challenge.timerEnabled && challenge.timerMinutes>0 ? Date.now() + challenge.timerMinutes*60000 : null);
  renderTestQuestion();
}
let saveRunTO = null;
function saveRunAnswers(delay){
  clearTimeout(saveRunTO);
  saveRunTO = setTimeout(()=>{
    if(!RUN) return;
    api('/api/student/attempts/'+RUN.attemptId+'/answers', {method:'POST', headers:{'x-user-id':getWallet()}, body:JSON.stringify({answers: RUN.answers, proctoring:studentProctoring()})}).catch(()=>{});
  }, delay ? 700 : 200);
}
function renderTestQuestion(){
  const R = RUN;
  if(!R) return;
  if(R.deadline && !R.timer){
    R.timer = setInterval(()=>{
      const el = document.getElementById('runTimer');
      if(!el){ return; }
      const left = R.deadline - Date.now();
      el.textContent = fmtDur(Math.max(0,left));
      if(left<=0 && !R.submitLock){
        clearInterval(R.timer);
        view.innerHTML = '<div class="card" style="text-align:center"><p class="muted">Czas minął — wysyłamy odpowiedzi…</p></div>';
        submitRun();
      }
    }, 1000);
  }
  const q = R.questions[R.idx];
  const total = R.questions.length;
  const answered = R.questions.filter((x,i)=>hasAnswerFor(R,i)).length;
  view.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <a class="btn btn-ghost btn-sm" href="#/student">← Panel</a>
      <div style="text-align:right"><span class="muted" style="font-size:.85rem">${esc(R.challenge.title||'Test')}</span>${R.deadline?` <span id="runTimer" style="font-family:var(--font-mono);font-weight:700;color:var(--green-dark)">${fmtDur(R.deadline-Date.now())}</span>`:''}</div>
    </div>
    <div class="student-safety" style="margin-top:14px"><b>Sesja chroniona</b><span>Pełny ekran · wklejanie zablokowane</span></div>
    <div class="card" style="margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span class="rp-kicker" style="margin:0">Pytanie ${R.idx+1}/${total}</span>
        <span class="muted" style="font-size:.78rem">Odpowiedziano na ${answered}/${total}</span>
      </div>
      ${q?.chapterTitle?`<div class="muted" style="font-size:.8rem;margin-bottom:8px">${esc(q.chapterTitle)}</div>`:''}
      ${q ? `<div style="font-weight:600;font-size:1rem">${esc(q.question)} <span class="muted" style="font-weight:400;font-size:.8rem">[${typeLabel(q.type)}]</span></div>
        <div style="margin-top:12px">${questionControls(q)}</div>` : '<p class="muted">Brak pytań.</p>'}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="bPrev" ${R.idx===0?'disabled':''}>← Poprzednie</button>
        <button class="btn btn-primary" id="bNext">${R.idx===total-1?'Podsumowanie →':'Następne →'}</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px;text-align:center">
      <button class="btn btn-primary btn-lg" id="bSubmit" style="width:100%" ${R.submitLock?'disabled':''}>Sprawdź odpowiedzi</button>
      <p class="muted" style="margin-top:8px">Po wysłaniu odpowiedzi nie będzie można ich zmienić. Test zostanie oceniony automatycznie.</p>
    </div>`;
  view.querySelectorAll('[data-kind="opt"]').forEach(b=>b.addEventListener('click', ()=>{
    RUN.answers[q.id] = Number(b.dataset.v);
    view.querySelectorAll('[data-kind="opt"]').forEach(x=>x.classList.toggle('active', x===b));
    saveRunAnswers();
  }));
  view.querySelectorAll('.run-chk').forEach(c=>c.addEventListener('change', ()=>{
    const cur = (Array.isArray(RUN.answers[q.id]) ? RUN.answers[q.id].slice() : []);
    const v = Number(c.dataset.v), i = cur.indexOf(v);
    i>=0 ? cur.splice(i,1) : cur.push(v);
    RUN.answers[q.id] = cur.sort((a,b)=>a-b);
    saveRunAnswers();
  }));
  const txt = view.querySelector('.run-txt');
  if(txt) txt.addEventListener('input', e=>{ RUN.answers[q.id] = e.target.value; saveRunAnswers(true); });
  view.querySelectorAll('.run-ord').forEach(s=>s.addEventListener('change', ()=>{
    const arr = new Array((q.items||[]).length).fill(null);
    view.querySelectorAll('.run-ord').forEach(x=>{ const pi = Number(x.dataset.i), v = Number(x.value); if(v>=0) arr[pi]=v; });
    RUN.answers[q.id] = arr;
    saveRunAnswers();
  }));
  const bPrev = view.querySelector('#bPrev'), bNext = view.querySelector('#bNext');
  if(bPrev) bPrev.addEventListener('click', ()=>{ if(RUN.idx>0){ RUN.idx--; renderTestQuestion(); } });
  bNext.addEventListener('click', ()=>{
    if(RUN.idx >= RUN.questions.length-1){ submitRun(); }
    else { RUN.idx++; renderTestQuestion(); }
  });
  view.querySelector('#bSubmit').addEventListener('click', ()=>submitRun());
}
function hasAnswerFor(R, idx){
  const q = R.questions[idx]; if(!q) return false;
  const v = R.answers[q.id];
  if(v===undefined || v===null) return false;
  if(typeof v==='string') return v.trim().length>0;
  return true;
}
async function submitRun(){
  const R = RUN;
  if(!R || R.submitLock) return;
  R.submitLock = true;
  try{
    const z = await api('/api/student/attempts/'+R.attemptId+'/submit', {method:'POST', headers:{'x-user-id':getWallet()}, body:JSON.stringify({wallet:getWallet(), studentId:getWallet(), proctoring:studentProctoring()})});
    if(R.timer) clearInterval(R.timer);
    stopStudentProctor();
    R.certificate = z.certificate || null;
    renderTestResult(z.attempt, R.challenge, z.attempt.detail || null, R.certificate);
  }catch(e){
    alert(e.message);
    R.submitLock = false;
    renderTestQuestion();
  }
}
function fmtAnswerHint(r){
  const a = r.answer;
  if(a===undefined || a===null || a==='') return '—';
  if(Array.isArray(a)) return a.map(x=>(Number(x)+1)+'.').join(', ');
  return String(a);
}
function renderTestResult(att, challenge, detail, certificate){
  const maxScore = att.maxScore ?? (detail&&detail.maxScore) ?? 0;
  const score = att.score ?? (detail&&detail.score) ?? 0;
  const pct = maxScore ? Math.round((score/maxScore)*100) : 0;
  const status = att.gradedStatus || (detail&&detail.status) || (pct>=60?'Passed':'Failed');
  const passed = status==='Passed' || pct>=60;
  const results = (detail&&detail.results) || [];
  view.innerHTML = `
    <div class="card" style="text-align:center;margin-top:6px;background:${passed?'var(--green-soft)':'#FFF7F7'};border-color:${passed?'var(--green)':'#E5B8B8'}">
      <p class="rp-kicker" style="margin-top:0">${challenge?esc(challenge.title||'Test'):'Test'}</p>
      <div style="font-family:var(--font-display);font-size:2.6rem;font-weight:800;color:${passed?'var(--green-dark)':'#B3261E'}">${pct}%</div>
      <div style="font-size:1.15rem;font-weight:700">Your result: ${score} / ${maxScore}</div>
      <div class="muted" style="margin-top:4px">Test został przesłany.</div>
      <span class="pill ${passed?'ok':''}" style="${passed?'':'background:#FDE8E8;color:#B3261E'}">${passed?'PASSED':'NIEZALICZONY'}</span>
      ${certificate?`<div style="margin-top:14px;padding:14px;border:1px solid var(--green);border-radius:14px"><strong>Certyfikat za całą książkę</strong><div class="muted" style="font-size:.82rem;margin:4px 0 10px">${esc(certificate.id)}</div><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="/verify/?id=${esc(encodeURIComponent(certificate.id))}">Zobacz i zweryfikuj certyfikat</a></div>`:''}
      <div style="margin-top:12px"><a class="btn btn-ghost btn-sm" href="#/student">← Panel ucznia</a></div>
    </div>`;
  if(results.length){
    view.innerHTML += `<div class="card" style="margin-top:12px">
      <p class="rp-kicker">Odpowiedzi</p>
      <div id="resDetail"></div></div>`;
    document.getElementById('resDetail').innerHTML = results.map((r,i)=>`
      <div style="border-bottom:1px solid var(--line);padding:8px 0;font-size:.85rem">
        <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600">${i+1}. ${esc(r.question||'')}</span><span>${r.correct?'<span class="pill ok">✓</span>':'<span class="pill" style="background:#FDE8E8;color:#B3261E">✗</span>'}</span></div>
        <div class="muted" style="margin-top:3px">Twoja odpowiedź: ${esc(fmtAnswerHint(r))}</div>
        ${r.correctText?`<div class="muted" style="margin-top:2px">Poprawna: ${esc(r.correctText)}</div>`:''}
      </div>`).join('');
  }
}
async function loadStudentQuizzes(classCode, cls){
  const container = document.getElementById('studentQuizzes');
  try{
    const proofs = JSON.parse(localStorage.getItem('rp_app_proofs')||'[]');
    const studentProofs = proofs.filter(p=>p.walletAddress===getWallet() && cls.chapters.includes(p.chapterId));
    const assignedChapters = cls.chapters;
    container.innerHTML = assignedChapters.map(ch=>{
      const done = studentProofs.find(p=>p.chapterId===ch);
      return `<div class="book-row"><div class="t"><b>Rozdział ${ch}</b><br><span class="muted">${cls.bookId}</span></div>${done ? `<span class="pill ok">${done.score}/${done.total}</span><a class="btn btn-ghost btn-sm" href="#/result">Zobacz</a>` : `<button class="btn btn-primary btn-sm" data-ch="${ch}" data-book="${cls.bookId}">Rozpocznij</button>`}</div>`;
    }).join('');
    container.querySelectorAll('[data-ch]').forEach(btn=>{
      btn.addEventListener('click', ()=>nav('#/chapter/'+btn.dataset.book+'/'+btn.dataset.ch));
    });
  }catch(e){ container.innerHTML = '<p class="muted">Błąd.</p>'; }
}
const PRIVY_DEFAULT_APP_ID = 'cmu9win8e01oo0ckzvcz6j0qg';

function setPubWallet(w){ try{ w?localStorage.setItem('readproof_publisher_wallet',w):localStorage.removeItem('readproof_publisher_wallet'); }catch(e){} }

let privyMountedApp = false;
async function mountPrivyApp(){
  if(privyMountedApp) return; privyMountedApp = true;
  const box = document.getElementById('privyRoot'); if(!box) return;
  const t = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
  try{
    const [{default:React},{createRoot},privy,privySol] = await Promise.all([
      t(import('https://esm.sh/react@18.3.1'), 25000), t(import('https://esm.sh/react-dom@18.3.1/client'), 25000),
      t(import('https://esm.sh/@privy-io/react-auth@3.16.0?deps=react@18.3.1,react-dom@18.3.1'), 60000),
      t(import('https://esm.sh/@privy-io/react-auth@3.16.0/solana?deps=react@18.3.1,react-dom@18.3.1'), 60000)
    ]);
    const e = React.createElement;
    function Inner(){
      const {ready, authenticated, user, login} = privy.usePrivy();
      React.useEffect(()=>{ const w0=(privySol.useWallets?privySol.useWallets().wallets:[])[0]; const addr=(w0&&w0.address)||(user&&user.wallet&&(user.wallet.address||(user.solanaWallet&&user.solanaWallet.address))); if(authenticated&&addr){setPubWallet(addr); renderPublisher();} },[authenticated]);
      if(!ready) return e('span',{className:'muted'},'Inicjalizacja…');
      if(authenticated) return e('span',{className:'muted'},'Zalogowano…');
      return e('button',{className:'btn btn-primary btn-lg',style:{width:'100%'},onClick:()=>login()},'Zaloguj Privy');
    }
    createRoot(box).render(e(privy.PrivyProvider,{appId:PRIVY_DEFAULT_APP_ID,config:{appearance:{walletChainType:'solana-only',showWalletLoginFirst:true},loginMethods:['wallet','email'],embeddedWallets:{createOnLogin:'users-without-wallets'}},children:e(Inner)}));
  }catch(err){ privyMountedApp=false; if(box) box.innerHTML=`<p class="muted">Privy nie załadowało się.</p>`; }
}

/* ═══ proctoring listeners ═══ */
let procListenersOn = false;
function ensureProctorListeners(){
  if(procListenersOn) return; procListenersOn = true;
  document.addEventListener('fullscreenchange', ()=>{ if(!proctor||!location.hash.startsWith('#/quiz/')) return; if(!document.fullscreenElement){ proctor.exits++; if(proctor.exits>=3){ failFinish(proctor.sid,'fullscreen exits'); return; } procToast(L('Wyjście z pełnego ekranu ('+proctor.exits+'/3). Wróć.','Left fullscreen ('+proctor.exits+'/3). Go back.')); try{document.documentElement.requestFullscreen().catch(()=>{});}catch(e){} } });
  document.addEventListener('visibilitychange', ()=>{ if(!proctor||!location.hash.startsWith('#/quiz/')) return; if(document.visibilityState==='hidden'){ proctor.tabs++; procToast(L('Nie zmieniaj kart ('+proctor.tabs+'/3).','Don\'t switch tabs ('+proctor.tabs+'/3).')); if(proctor.tabs>=3){ failFinish(proctor.sid,'tab switches '+proctor.tabs+'x'); } } });
  ['copy','cut','paste'].forEach(ev=>document.addEventListener(ev, e=>{ if(!proctor||!location.hash.startsWith('#/quiz/'))return; if(view.contains(e.target)||e.target===view){e.preventDefault(); if(ev==='paste'){proctor.pastes++; procToast(L('Wklejanie zablokowane.','Pasting is blocked.'));} else {proctor.copies++; procToast(L('Kopiowanie zablokowane.','Copying is blocked.'));} } },true));
  document.addEventListener('contextmenu', e=>{ if(!proctor||!location.hash.startsWith('#/quiz/'))return; e.preventDefault(); }, true);
  document.addEventListener('keydown', e=>{ if(!proctor||!location.hash.startsWith('#/quiz/'))return; const k=(e.key||'').toLowerCase(); if(k==='printscreen'||k==='f12'||((e.ctrlKey||e.metaKey)&&['c','x','u','s','p','v'].includes(k))){e.preventDefault(); if(k==='v'&&(e.ctrlKey||e.metaKey)){proctor.pastes++;procToast(L('Wklejanie zablokowane.','Pasting is blocked.'));} else {proctor.copies++;procToast(L('Zablokowane.','Blocked.'));} } },true);
  window.addEventListener('beforeunload', e=>{ if(proctor&&location.hash.startsWith('#/quiz/')){ e.preventDefault(); e.returnValue=''; } });
}
function procToast(msg){ let t=document.getElementById('procToast'); if(!t){t=document.createElement('div');t.id='procToast';t.style.cssText='position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:9999;background:#3A2E00;color:#FFE9B0;padding:10px 16px;border-radius:12px;font-size:.85rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center';document.body.appendChild(t);} t.textContent=msg; clearTimeout(t._h); t._h=setTimeout(()=>{if(document.getElementById('procToast'))document.getElementById('procToast').remove();},4000); }
function failFinish(sid, reason){ const prog=proctor||{tabs:0,pastes:0,exits:0,copies:0}; stopProctor(); try{api('/api/sessions/'+encodeURIComponent(sid)+'/complete?fail=1',{method:'POST',body:JSON.stringify({proctoring:{tabSwitches:prog.tabs||0,pastes:prog.pastes||0,fullscreenExits:prog.exits||0,copies:prog.copies||0}})}).then(r=>{LAST_RESULT={proof:r.proof,verification:r.verification,results:r.results,meta:SESSION_META};try{localStorage.setItem('rp_app_last_result',JSON.stringify(LAST_RESULT));}catch(e){}saveLocalProof(LAST_RESULT.proof);nav('#/result');}).catch(()=>{view.innerHTML=`<div class="card"><h3>${L('Sesja zakończona (naruszenie).','Session ended (violation).')}</h3><a class="btn btn-ghost" href="#/">${L('Katalog','Catalog')}</a></div>`;});}catch(e){} }
