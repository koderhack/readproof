<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel wydawcy — nowa lokalizacja · ReadProof</title>
<meta name="description" content="Panel wydawcy ReadProof ma nowy adres: /publishers/. Automatyczne przekierowanie.">
<meta http-equiv="refresh" content="5;url=/publishers/">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main class="wrap rp-center" style="padding:70px 20px">
  <p class="rp-kicker">Panel wydawcy</p>
  <h1 class="rp-h2">Panel ma nowy adres.</h1>
  <p class="rp-sub">Informacje dla wydawców i panel w jednym miejscu.<br><strong>Przekierowanie za <span id="secs">5</span> s…</strong></p>
  <div class="rp-actions" style="justify-content:center">
    <a class="btn btn-primary btn-lg" id="go" href="/publishers/">Otwórz stronę wydawców →</a>
  </div>
  <noscript><p class="muted" style="margin-top:16px">JavaScript wyłączony — <a href="/publishers/">kliknij, aby otworzyć stronę wydawców</a> (przeglądarka przekieruje automatycznie).</p></noscript>
</main>
<script>
(function(){
  var t = '/publishers/' + location.search;
  document.getElementById('go').href = t;
  var n = 5, s = document.getElementById('secs');
  var timer = setInterval(function(){
    n--;
    if(n <= 0){ clearInterval(timer); location.replace(t); return; }
    s.textContent = n;
  }, 1000);
})();
</script>
</body>
</html>
