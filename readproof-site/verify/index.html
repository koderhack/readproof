<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify a ReadProof Certificate</title>
<meta name="description" content="Check any ReadProof Certificate by ID: book, holder, score and proof details.">
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<meta name="theme-color" content="#58CC02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
@media print{
  .rp-nav,.rp-footer,.btn,.no-print{display:none!important}
  body{background:#fff}
  @page{size:A4 landscape;margin:0}
  body *{visibility:hidden}
  .cert,.cert *{visibility:visible}
  .cert{position:absolute;left:0;top:0;width:100%;min-height:100vh;box-shadow:none;animation:none;border-radius:0}
}
</style>
</head>
<body>
<nav class="rp-nav"><div class="wrap">
  <a class="rp-brand" href="/"><span class="rp-brand-mark">R</span>ReadProof</a>
  <div class="rp-links">
    <a href="/students/" class="keep" data-i18n="nav_students">Students</a>
    <a href="/teachers/" class="keep" data-i18n="nav_teachers">Teachers</a>
    <a href="/publishers/" data-i18n="nav_publishers">Publishers</a>
    <span class="lang-sw" role="group" aria-label="Language / Język"><button data-lang="pl">PL</button><button data-lang="en">EN</button></span>
    <a href="/" class="cta" data-i18n="nav_home">Home</a>
  </div>
</div></nav>

<main class="wrap">
  <section class="rp-section tight rp-center" style="padding-bottom:0">
    <p class="rp-kicker" data-i18n="v_k">Verification</p>
    <h1 class="rp-h2" data-i18n="v_h">Verify a certificate.</h1>
    <p class="rp-sub" data-i18n="v_sub">Enter a Certificate ID (e.g. <code class="inline">RP-7K2Q</code>) or open a shared certificate link.</p>
    <form id="f" class="form-row" style="max-width:480px;margin:0 auto">
      <div class="field" style="flex:1"><label for="q" data-i18n="v_label">Certificate ID</label><input id="q" class="mono" placeholder="RP-XXXX" autocomplete="off"></div>
      <div class="field" style="flex:0;align-self:end"><button class="btn btn-primary" type="submit" data-i18n="v_btn">Verify</button></div>
    </form>
  </section>
  <section class="rp-section tight"><div id="out"></div></section>
</main>

<footer class="rp-footer"><div class="wrap">
  <div><span class="fbrand">ReadProof</span><br><span data-i18n="foot_tag">Read a real book. Prove you understood it.</span></div>
  <div><a href="/" data-i18n="nav_home">Home</a> · <a href="/students/" data-i18n="nav_students">Students</a></div>
</div></footer>

<script>
(function(){
  const API = 'https://frog02.mikr.us:32287';
  const DEMO = {
    'RP-7K2Q': { book: 'Dziady, Part III', author: 'Adam Mickiewicz', holder: 'Alexandra Nowak', score: '92%', date: '2026-09-18' },
    'RP-3M8P': { book: 'Dziady, Part III', author: 'Adam Mickiewicz', holder: 'Bartosz K.', score: '88%', date: '2026-09-17' },
    'RP-9Q2D': { book: 'Dziady, Part III', author: 'Adam Mickiewicz', holder: 'Ewa M.', score: '81%', date: '2026-09-16' }
  };
  const out = document.getElementById('out');
  const q = document.getElementById('q');
  const T = (k, fb) => (window.rpT ? window.rpT(k, fb) : fb);
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const BASES = ['https://frog02.mikr.us:32287', 'http://frog02.mikr.us:32287'];
  async function apiGet(path){
    for(const b of BASES){
      try{ const r = await fetch(b + path); if(r.ok) return await r.json(); }catch(e){}
    }
    throw new Error('offline');
  }
  /* obrazek certyfikatu (PNG do załączenia na X / LinkedIn) + pomoc licencji */
  function fitCertText(x,text,cx,y,maxW,size){ let s=size; x.font='800 '+s+'px Georgia,serif'; while(x.measureText(text).width>maxW&&s>28){ s-=4; x.font='800 '+s+'px Georgia,serif'; } x.fillText(text,cx,y); }
  function certPNG(d){
    const W=1200,H=630,c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d');
    x.fillStyle='#FFFBEB'; x.fillRect(0,0,W,H);
    x.strokeStyle='#58CC02'; x.lineWidth=10; x.strokeRect(24,24,W-48,H-48);
    x.strokeStyle='#C5A15A'; x.lineWidth=3; x.strokeRect(48,48,W-96,H-96);
    x.textAlign='center'; x.fillStyle='#0B0B0F';
    x.font='800 64px Georgia,serif'; x.fillText('ReadProof',W/2,150);
    x.font='600 30px Georgia,serif'; x.fillStyle='#5C6368'; x.fillText(d.tierLabel||'Certificate',W/2,205);
    x.fillStyle='#0B0B0F'; fitCertText(x, d.book||'', W/2, 315, 1000, 72);
    x.font='400 34px Georgia,serif'; x.fillStyle='#5C6368'; x.fillText(d.holder||'',W/2,378);
    x.font='700 46px system-ui,sans-serif'; x.fillStyle='#0B0B0F'; x.fillText(d.score||'',W/2,452);
    x.font='400 26px ui-monospace,monospace'; x.fillStyle='#46A302'; x.fillText('id: '+(d.id||''),W/2,512);
    x.fillStyle='#8A9398'; x.font='400 24px ui-monospace,monospace'; x.fillText('readproof.pages.dev · Solana Devnet (demo)',W/2,562);
    x.save(); x.translate(W-195,150); x.rotate(-0.14);
    x.strokeStyle='#46A302'; x.lineWidth=5; x.strokeRect(-135,-46,270,92);
    x.fillStyle='#46A302'; x.font='900 32px Georgia,serif'; x.fillText(d.seal||'VERIFIED',0,11); x.restore();
    return c.toDataURL('image/png');
  }
  function isRealSig(s){ return typeof s === 'string' && /^[1-9A-HJ-NP-Za-km-z]{32,128}$/.test(s) && !/^mock/i.test(s); }
  function isWallet(a){ return typeof a === 'string' && /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a); }
  function explorerHref(raw){
    if(raw && isRealSig(raw.txSignature)) return {url: 'https://explorer.solana.com/tx/' + encodeURIComponent(raw.txSignature) + '?cluster=devnet', tx: true};
    const w = raw && (raw.walletAddress || '');
    if(isWallet(w)) return {url: 'https://explorer.solana.com/address/' + encodeURIComponent(w) + '?cluster=devnet', tx: false};
    return {url: 'https://explorer.solana.com/?cluster=devnet', tx: false};
  }
  const BOOK_TITLES_PL = {alice:'Alicja w Krainie Czarów', sherlock:'Sherlock Holmes', treasure:'Wyspa Skarbów', tomsawyer:'Tomek Sawyer', around:'W 80 dni dookoła świata', grimm:'Bajki Braci Grimm', andersen:'Baśnie Andersena', oz:'Czarnoksiężnik z Oz', peterrabbit:'Piotruś Królik', pinocchio:'Pinokio', threepigs:'Trzy świnki'};
  let BOOKCAT = null;
  async function bookCat(){
    if(BOOKCAT) return BOOKCAT;
    try{ const b = await apiGet('/api/books'); BOOKCAT = Array.isArray(b) ? b : []; }
    catch(e){ BOOKCAT = []; }
    return BOOKCAT;
  }
  function bookTitle(id){
    if(BOOK_TITLES_PL[id]) return BOOK_TITLES_PL[id];
    const b = (BOOKCAT||[]).find(x=>String(x.id)===String(id));
    return (b && b.title) || String(id || '');
  }
  function chapterTitle(bookId, chapterId){
    const b = (BOOKCAT||[]).find(x=>String(x.id)===String(bookId));
    const c = b && (b.chapters||[]).find(x=>String(x.id)===String(chapterId));
    return (c && (c.title || c.id)) || String(chapterId || '');
  }
  async function verify(id){
    id = (id || '').trim().toUpperCase();
    if(!id){ out.innerHTML = ''; return; }
    q.value = id;
    out.innerHTML = '<p class="muted rp-center">' + esc(T('vf_checking', 'Checking…')) + '</p>';
    // 1) try live backend proofs
    try{
      const proofs = await apiGet('/api/proofs');
      const list = Array.isArray(proofs) ? proofs : (proofs.proofs || []);
      const hit = list.find(p => (p.proofHash || '').toUpperCase().startsWith(id.replace('RP-','')) || (p.id || '').toUpperCase() === id);
      if(hit){
        await bookCat();
        let holderName = (hit.walletAddress||'').slice(0,10) + '…';
        try{ const u = await apiGet('/api/users/' + encodeURIComponent(hit.walletAddress)); if(u && u.user && (u.user.displayName || u.user.email)) holderName = u.user.displayName || u.user.email; }catch(e){}
        const tierTmp = tierOf(hit.score, hit.total);
        const didTmp = tierTmp === 'full' ? 'wykazał(a) pełne zrozumienie lektury.' : tierTmp === 'partial' ? 'wykazał(a) częściowe zrozumienie lektury.' : 'nie wykazał(a) zrozumienia lektury.';
        out.innerHTML = certHTML({ book: bookTitle(hit.bookId), bookId: hit.bookId, chapter: chapterTitle(hit.bookId, hit.chapterId), chapterId: hit.chapterId, author: '', holder: holderName, holderDid: didTmp, score: hit.score + '/' + hit.total, date: hit.timestamp || '' }, false, hit);
        return;
      }
    }catch(e){ /* offline → demo lookup */ }
    // 2) demo certificates (clearly labeled)
    const d = DEMO[id];
    if(d){ out.innerHTML = certHTML(d, true, null); return; }
    out.innerHTML = '<div class="card rp-center"><h3>' + esc(T('vf_notfound', 'Certificate not found')) + '</h3><p class="muted">' + esc(T('vf_noid_a', 'No certificate with ID')) + ' <span class="mono">' + esc(id) + '</span> ' + esc(T('vf_noid_b', 'in live records or demo set.')) + ' <a href="/verify/?id=RP-7K2Q">RP-7K2Q</a>.</p></div>';
  }
  /* progi certyfikatu: 5/5 pełne zrozumienie, 3–4/5 (≥60%) częściowe, poniżej brak */
  function tierOf(score, total){
    const s = Number(score), t = Number(total);
    if(t > 0 && s >= t) return 'full';
    const r = t > 0 ? s / t : ((parseFloat(String(score)) || 0) / 100);
    return r >= 0.6 ? 'partial' : 'none';
  }
  function certHTML(d, demo, raw){
    const ex = explorerHref(raw);
    const tier = raw ? tierOf(raw.score, raw.total) : tierOf(d.score, 100);
    const badge = tier === 'full' ? '✓ Verified'
      : tier === 'partial' ? esc(T('tier_ps', '◐ Partial')) : esc(T('tier_ns', '✗ Not demonstrated'));
    const tierLine = tier === 'full' ? esc(T('lp_line', 'Demonstrated understanding · Score:'))
      : tier === 'partial' ? esc(T('tier_partial', 'Partial understanding'))
      : esc(T('tier_none', 'Understanding not demonstrated'));
    return '<div class="cert">'
      + '<div class="cert-k">ReadProof Certificate · ' + badge + '</div>'
      + '<h3>' + esc(d.book) + '</h3>'
      + (d.chapter ? '<div class="cert-book">' + esc(d.chapter) + '</div>' : '')
      + (d.author ? '<div class="cert-book">' + esc(d.author) + '</div>' : '')
      + '<div class="cert-name">' + esc(d.holder) + '</div>'
      + '<p class="muted" style="margin:4px 0 0;font-size:.88rem">Niniejszym potwierdza się, że <b>' + esc(d.holder) + '</b> ' + esc(d.holderDid || tierLine) + '</p>'
      + '<p style="margin:6px 0 0;font-weight:800;font-size:1.3rem">' + esc(d.score) + '</p>'
      + '<div class="cert-meta"><span>' + esc(q.value.toUpperCase()) + '</span><span>✓ ' + esc(T('vf_proofrec', 'Proof recorded')) + '</span></div>'
      + '<div class="cert-meta" style="margin-top:6px"><span class="mono">id: ' + esc(d.bookId || d.book || '') + (d.chapterId ? ' · ' + esc(d.chapterId) : '') + '</span></div>'
      + '<div class="proof-mini" style="text-align:left;margin-top:18px"><b>' + esc(T('vf_details', 'Proof Details')) + '</b><br>'
      + '<span class="mono" style="font-size:.75rem">' + esc(T('vf_net', 'Network: Solana Devnet')) + '<br>' + esc(T('vf_proofid', 'Proof ID:')) + ' ' + esc(q.value.toUpperCase()) + '<br>'
      + (raw && raw.txSignature ? esc(T('vf_tx', 'Transaction:')) + ' ' + esc(raw.txSignature) : esc(T('vf_tx', 'Transaction:')) + ' ' + esc(T('vf_devnet', 'devnet record')) + (demo ? ' (demo)' : '')) + '</span></div>'
      + (demo ? '<div style="margin-top:12px"><span class="demo-tag">' + esc(T('vf_demo', 'DEMO · illustrative example')) + '</span></div>' : '')
      + '</div>'
      + '<div class="no-print" style="margin-top:14px;text-align:center"><a class="btn btn-ghost btn-sm" target="_blank" href="' + ex.url + '">' + esc(ex.tx ? T('vf_explorer_tx', 'Zobacz transakcję w Explorerze →') : T('vf_explorer_acct', 'Zobacz konto w Explorerze (Devnet) →')) + '</a></div>'
      + '<div class="no-print" style="margin-top:10px;text-align:center">'
      + '<button class="btn btn-primary btn-sm" id="bShare">' + esc(T('vf_share', 'Share')) + '</button> '
      + '<button class="btn btn-ghost btn-sm" id="bPdf">' + esc(T('vf_pdf', 'Pobierz PDF')) + '</button> '
      + '<button class="btn btn-ghost btn-sm" id="bPng">' + esc(T('vf_png', 'Obrazek PNG')) + '</button> '
      + '<a class="btn btn-ghost btn-sm" target="_blank" id="bLinkedIn">LinkedIn</a> '
      + '<a class="btn btn-ghost btn-sm" target="_blank" id="bX">X</a></div>'
      + '<details class="no-print" style="margin:12px auto 0;max-width:520px;text-align:left"><summary class="muted" style="cursor:pointer;font-size:.85rem">' + esc(T('vf_lic', 'Dodaj do profilu LinkedIn → Licencje i certyfikaty')) + '</summary>'
      + '<div class="card flat" style="margin-top:8px;font-size:.85rem">'
      + '<div><b>' + esc(T('vf_lic_name', 'Nazwa')) + ':</b> ' + esc('ReadProof Certificate — ' + (d.book || '')) + ' <button class="btn btn-ghost btn-sm" data-copytext="' + esc('ReadProof Certificate — ' + (d.book || '')) + '">' + esc(T('vf_copy', 'Kopiuj')) + '</button></div>'
      + '<div style="margin-top:6px"><b>ReadProof</b> · ID: <span class="mono">' + esc(q.value.toUpperCase()) + '</span> <button class="btn btn-ghost btn-sm" data-copytext="' + esc(q.value.toUpperCase()) + '">' + esc(T('vf_copy', 'Kopiuj')) + '</button></div>'
      + '<div style="margin-top:6px"><b>URL:</b> <span class="mono" style="word-break:break-all">' + esc(location.origin + location.pathname + '?id=' + q.value.toUpperCase()) + '</span></div>'
      + '<p class="muted" style="font-size:.78rem;margin:8px 0 0">' + esc(T('vf_lic_how', 'Profil → Dodaj sekcję → Licencje i certyfikaty → wklej powyższe.')) + '</p>'
      + '</div></details>';
  }
  document.addEventListener('click', async function(e){
    if(e.target && e.target.id === 'bShare'){
      const url = location.origin + location.pathname + '?id=' + encodeURIComponent((document.getElementById('q')||{}).value || '');
      const title = document.querySelector('.cert h3');
      const holder = document.querySelector('.cert-name');
      const book = title ? title.textContent : 'Proof of Comprehension';
      const isPl = (document.documentElement.lang||'pl').toLowerCase().startsWith('pl');
      const text = isPl
        ? 'Uzyskałem certyfikat ukończenia książki „' + book + '” wykazując zrozumienie lektury — ReadProof ✓'
        : 'I earned a book completion certificate for „' + book + '” by demonstrating comprehension — ReadProof ✓';
      // załącz obrazek jeśli system na to pozwala
      const scoreEl = document.querySelector('.cert p[style*="font-weight:800"]');
      const qv = (document.getElementById('q')||{}).value || '';
      const d = {book, holder: holder?holder.textContent:'', score: scoreEl?scoreEl.textContent:'', id: qv, tierLabel: document.querySelector('.cert-k')?document.querySelector('.cert-k').textContent:'', seal: 'VERIFIED'};
      try{
        const dataUrl = certPNG(d);
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const file = new File([blob], 'readproof-'+(qv||'cert')+'.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({title: 'ReadProof', text, url, files:[file]});
          return;
        }
      }catch(err){}
      if(navigator.share){ navigator.share({title: 'ReadProof', text, url}).catch(()=>{}); }
      else{ navigator.clipboard.writeText(text + ' ' + url).then(()=>{ e.target.textContent = 'OK'; }); }
    }
  });
  document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'bPdf'){
      const h3 = document.querySelector('.cert h3');
      const holder = document.querySelector('.cert-name');
      const score = document.querySelector('.cert p[style*="font-weight:800"]');
      const qv = (document.getElementById('q')||{}).value || '';
      const d = {book: h3?h3.textContent:'', holder: holder?holder.textContent:'', score: score?score.textContent:'', id: qv, tierLabel: document.querySelector('.cert-k')?document.querySelector('.cert-k').textContent:'', seal: 'VERIFIED'};
      const url = certPNG(d);
      const w = window.open('', '_blank');
      if(!w){ const a=document.createElement('a'); a.href=url; a.download='readproof-'+(qv||'cert')+'.png'; a.click(); return; }
      w.document.write('<html><head><title>ReadProof Certificate</title><style>@page{size:A4 landscape;margin:0}body{margin:0;display:grid;place-items:center;min-height:100vh;background:#fff}img{width:100%;max-width:1120px;box-shadow:0 4px 24px rgba(0,0,0,.15)}@media print{body{background:#fff}}</style></head><body><img src="'+url+'"></body></html>');
      w.document.close(); setTimeout(()=>{ try{w.print();}catch(e){} }, 600);
    }
  });
  document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'bPng'){
      const h3 = document.querySelector('.cert h3');
      const holder = document.querySelector('.cert-name');
      const score = document.querySelector('.cert p[style*="font-weight:800"]');
      const qv = (document.getElementById('q')||{}).value || '';
      const d = {book: h3?h3.textContent:'', holder: holder?holder.textContent:'', score: score?score.textContent:'', id: qv, tierLabel: document.querySelector('.cert-k')?document.querySelector('.cert-k').textContent:'', seal: 'VERIFIED'};
      const a=document.createElement('a'); a.href=certPNG(d); a.download='readproof-'+(qv||'cert')+'.png'; a.click();
    }
  });
  // LinkedIn: dodaj jako Licencje i certyfikaty (jak certyfikaty programowania) — prefill
  document.addEventListener('click', function(e){
    const t = e.target && (e.target.id === 'bLinkedIn' || e.target.id === 'bX') ? e.target : null;
    if(!t) return;
    const qv = (document.getElementById('q')||{}).value || '';
    const h3 = document.querySelector('.cert h3');
    const book = h3 ? h3.textContent : 'Proof of Comprehension';
    const certUrl = location.origin + location.pathname + '?id=' + encodeURIComponent(qv);
    const lang = (document.documentElement.lang || '').toLowerCase().startsWith('pl') ? 'pl' : 'en';
    if(t.id === 'bLinkedIn'){
      const name = 'ReadProof Certificate — ' + book;
      const y = new Date().getFullYear(), m = new Date().getMonth()+1;
      t.href = 'https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME'
        + '&name=' + encodeURIComponent(name)
        + '&organizationName=' + encodeURIComponent('ReadProof')
        + '&issueYear=' + y + '&issueMonth=' + m
        + '&certUrl=' + encodeURIComponent(certUrl)
        + '&certId=' + encodeURIComponent(qv);
      return;
    }
    // X: załącz zdjęcie certyfikatu + tekst zależny od języka
    const isPl = lang === 'pl';
    const shareText = isPl
      ? 'Uzyskałem certyfikat ukończenia książki „' + book + '” wykazując zrozumienie lektury — ReadProof ✓'
      : 'I earned a book completion certificate for „' + book + '” by demonstrating comprehension — ReadProof ✓';
    // próbuj Web Share z plikiem (obrazek)
    const h = document.querySelector('.cert-name');
    const scoreEl = document.querySelector('.cert p[style*="font-weight:800"]');
    const d = {book, holder: h?h.textContent:'', score: scoreEl?scoreEl.textContent:'', id: qv, tierLabel: document.querySelector('.cert-k')?document.querySelector('.cert-k').textContent:'', seal: 'VERIFIED'};
    const dataUrl = certPNG(d);
    const tryFileShare = async ()=>{
      try{
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        const file = new File([blob], 'readproof-'+(qv||'cert')+'.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({text: shareText + ' ' + certUrl, files:[file]});
          return true;
        }
      }catch(e){}
      return false;
    };
    // handler async — nie ustawiamy href od razu, tylko na klik
    e.preventDefault();
    tryFileShare().then(ok=>{
      if(!ok){
        const url = encodeURIComponent(certUrl);
        const text = encodeURIComponent(shareText);
        window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + url, '_blank');
      }
    });
  });
  document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); history.replaceState(null,'','?id=' + encodeURIComponent(q.value.trim().toUpperCase())); verify(q.value); });
  verify(new URLSearchParams(location.search).get('id') || '');
})();
</script>
<script src="/assets/i18n.js"></script>
</body>
</html>
